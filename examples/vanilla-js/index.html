<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeType vanilla JS example</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    textarea, input { width: 100%; font: inherit; padding: 8px; box-sizing: border-box; }
    button { margin-top: 12px; font: inherit; padding: 6px 16px; }
    #log { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Comment box</h1>
  <form id="comment">
    <label for="name">Name</label>
    <input id="name" name="name">
    <label for="body">Comment</label>
    <textarea id="body" name="body" rows="4"></textarea>
    <input type="password" name="password" placeholder="Password fields are never touched">
    <button>Post</button>
  </form>
  <p id="log"></p>

  <!--
    From a CDN once published:
    <script src="https://unpkg.com/@safetype/dom@1/dist/safetype.global.js"></script>
    From this repository (after `pnpm build`):
  -->
  <script src="../../packages/dom/dist/safetype.global.js"></script>
  <script>
    const log = (text) => (document.getElementById("log").textContent = text);

    const safeType = SafeType.createSafeType({
      mode: "mask",
      policy: { harassment: { action: "block" } }, // mask swearing, block targeted insults
      onViolation: (result, element) => log(`${element.id}: ${result.matches.map((m) => m.category).join(", ")}`),
      onBlocked: () => log("Post blocked: please rephrase the highlighted field."),
    });
    safeType.start();

    document.getElementById("comment").addEventListener("submit", (event) => {
      event.preventDefault(); // demo only: SafeType already stopped blocked submissions
      log("Posted! (Your server should still re-check it with @safetype/core validate())");
    });
  </script>
</body>
</html>
